name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # --isolate semantics are load-bearing; bump deliberately

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon
        run: bun build daemon.ts --target bun --outdir /tmp/hb

      - name: Build bridge
        run: bun build bridge.ts --target bun --outdir /tmp/hb

      - name: Build CLI
        run: bun build cli/hydra.ts --target bun --outdir /tmp/hb

      # Zero gate: tsc's exit code decides. bun's bundler elides unused imports and
      # erases types, so it never sees the errors tsc does — this is the only gate
      # that does, and it fires on the PR, before merge.
      - name: Typecheck
        run: bunx tsc --noEmit

      # Dangerous primitives (destructive tmux/git, raw liveness) only in their owner files.
      - name: Owner check
        run: bun scripts/check-owners.ts

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Run tests
        env:
          DISCORD_BOT_TOKEN: test-token
          DEFAULT_SESSION_CHANNEL: '000000000000000000'
        run: |
          mkdir -p ~/.claude/channels/discord
          echo "### ALONE"; bun test --isolate daemon/__tests__/raindrop.test.ts -t defaultProjectFor 2>&1 | grep -E '^\(fail\)| pass$| fail$' || true
          for f in __tests__/topology-freshness.test.ts __tests__/gateway-health.test.ts __tests__/pr-watch-ci.test.ts __tests__/main-guard.test.ts __tests__/resume-health.test.ts __tests__/discord-table-format.test.ts cli/__tests__/helpers-config.test.ts cli/__tests__/peek.test.ts daemon/__tests__/main-bridge-cycle.test.ts daemon/__tests__/codex-runtime-boot.test.ts daemon/__tests__/modifiers.test.ts daemon/__tests__/transcript-dump.test.ts daemon/__tests__/util.test.ts daemon/__tests__/codex-queue-regressions.test.ts daemon/__tests__/protocol-runner.test.ts daemon/__tests__/plugin-start-script.test.ts daemon/__tests__/orchestration-tools.test.ts daemon/__tests__/cli-attach.test.ts daemon/__tests__/state-machine.test.ts; do
            r=$(bun test --isolate $f daemon/__tests__/raindrop.test.ts 2>&1 | grep -cE '^\(fail\) raindrop: defaultProjectFor' || true)
            echo "### PAIR $f -> raindrop fails=$r"
          done
