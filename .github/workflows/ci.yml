name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the suite takes ~2 min; a hang otherwise runs to GitHub's 6h default
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # the suite's bun; scripts/test.sh refuses any other. Bump deliberately: --isolate semantics are load-bearing, and 1.4.3 fixed spawnSync spinning forever after a GC (oven-sh/bun#34069)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon
        run: bun build daemon.ts --target bun --outdir /tmp/hb

      - name: Build bridge
        run: bun build bridge.ts --target bun --outdir /tmp/hb

      - name: Build CLI
        run: bun build cli/hydra.ts --target bun --outdir /tmp/hb

      # Zero gate: tsc's exit code decides. bun's bundler elides unused imports and
      # erases types, so it never sees the errors tsc does — this is the only gate
      # that does, and it fires on the PR, before merge.
      - name: Typecheck
        run: bunx tsc --noEmit

      # Dangerous primitives (destructive tmux/git, raw liveness) only in their owner files.
      - name: Owner check
        run: bun scripts/check-owners.ts

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Run tests
        run: |
          mkdir -p ~/.claude/channels/discord
          bun run test
