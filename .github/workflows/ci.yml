name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon
        run: bun build daemon.ts --target bun --outdir /tmp/hb

      - name: Build bridge
        run: bun build bridge.ts --target bun --outdir /tmp/hb

      - name: Build CLI
        run: bun build cli/hydra.ts --target bun --outdir /tmp/hb

      # Ratchet, not a zero-gate: fail only if the tsc error count rises above
      # the committed baseline. bun's bundler elides unused imports and erases
      # types, so it never sees the errors tsc does — this is the only gate that
      # does, and it fires on the PR, before merge (unlike the advisory
      # post-merge hook). On a decrease it nudges rather than auto-committing,
      # so the ceiling only moves under human intent.
      - name: Typecheck (ratchet)
        run: |
          COUNT=$(bunx tsc --noEmit 2>&1 | grep -c 'error TS' || true)
          MAX=$(cat .tsc-baseline)
          echo "tsc errors: $COUNT (ceiling $MAX)"
          if [ "$COUNT" -gt "$MAX" ]; then
            echo "::error::tsc errors rose from $MAX to $COUNT"
            bunx tsc --noEmit 2>&1 | grep 'error TS'
            exit 1
          fi
          if [ "$COUNT" -lt "$MAX" ]; then
            echo "::notice::ceiling can drop to $COUNT — update .tsc-baseline"
          fi

      - name: Run tests
        env:
          DISCORD_BOT_TOKEN: test-token
          DEFAULT_SESSION_CHANNEL: '000000000000000000'
        run: |
          mkdir -p ~/.claude/channels/discord
          bun test --path-ignore-patterns 'pane-probe'
          bun test daemon/__tests__/pane-probe.test.ts
