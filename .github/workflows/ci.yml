name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # --isolate semantics are load-bearing; bump deliberately

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon
        run: bun build daemon.ts --target bun --outdir /tmp/hb

      - name: Build bridge
        run: bun build bridge.ts --target bun --outdir /tmp/hb

      - name: Build CLI
        run: bun build cli/hydra.ts --target bun --outdir /tmp/hb

      # Zero gate: tsc's exit code decides. bun's bundler elides unused imports and
      # erases types, so it never sees the errors tsc does — this is the only gate
      # that does, and it fires on the PR, before merge.
      - name: Typecheck
        run: bunx tsc --noEmit

      # Dangerous primitives (destructive tmux/git, raw liveness) only in their owner files.
      - name: Owner check
        run: bun scripts/check-owners.ts

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Run tests
        env:
          DISCORD_BOT_TOKEN: test-token
          DEFAULT_SESSION_CHANNEL: '000000000000000000'
        run: |
          mkdir -p ~/.claude/channels/discord
          git fetch -q origin main
          for sha in origin/main cb7ee32 024f11a 25b9bf7 06ff6e7 ec057ff b6e6c98 752b37a 7b37faa; do
            rm -rf /tmp/w && git worktree add -q --detach /tmp/w $sha && (cd /tmp/w && bun install --frozen-lockfile >/dev/null 2>&1)
            for rep in 1 2 3; do
              r=$(cd /tmp/w && bun test --isolate --path-ignore-patterns 'daemon/__tests__/pane-probe.test.ts' --path-ignore-patterns 'daemon/__tests__/codex-launch-surface.tmux.test.ts' --path-ignore-patterns 'daemon/__tests__/codex-key-replacement.tmux.test.ts' 2>&1 | grep -E '^\(fail\)| fail$|Ran ' | tr '\n' ' ' || true)
              echo "### SHA $sha rep$rep -> $r" | cut -c1-400
            done
            git worktree remove --force /tmp/w
          done
