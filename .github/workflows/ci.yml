name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build daemon
        run: bun build daemon.ts --target bun --outdir /tmp/hb

      - name: Build bridge
        run: bun build bridge.ts --target bun --outdir /tmp/hb

      - name: Build CLI
        run: bun build cli/hydra.ts --target bun --outdir /tmp/hb

      # Zero gate: tsc's exit code decides. bun's bundler elides unused imports and
      # erases types, so it never sees the errors tsc does — this is the only gate
      # that does, and it fires on the PR, before merge.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Run tests
        env:
          DISCORD_BOT_TOKEN: test-token
          DEFAULT_SESSION_CHANNEL: '000000000000000000'
        run: |
          mkdir -p ~/.claude/channels/discord
          bun test --isolate --path-ignore-patterns 'daemon/__tests__/pane-probe.test.ts' --path-ignore-patterns 'daemon/__tests__/codex-launch-surface.tmux.test.ts' --path-ignore-patterns 'daemon/__tests__/codex-key-replacement.tmux.test.ts'
          bun test daemon/__tests__/pane-probe.test.ts
          bun test daemon/__tests__/codex-launch-surface.tmux.test.ts
          bun test daemon/__tests__/codex-key-replacement.tmux.test.ts
