name: CI

on:
  push:
    branches: [sf/ci-debug-403]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sha: [7b37faafa0bebb726cfec5855366bc696f224ff2, a12d0e6140f6d059c793498a7e1474e37c799ec4]
        mode: [single, split, single-b, split-b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y tmux
      - name: Run tests x4
        env:
          DISCORD_BOT_TOKEN: test-token
          DEFAULT_SESSION_CHANNEL: '000000000000000000'
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p ~/.claude/channels/discord
          X="--path-ignore-patterns daemon/__tests__/pane-probe.test.ts --path-ignore-patterns daemon/__tests__/codex-launch-surface.tmux.test.ts --path-ignore-patterns daemon/__tests__/codex-key-replacement.tmux.test.ts"
          for rep in 1 2 3 4; do
            case $MODE in single*) timeout 300 bun test --isolate > out.txt 2>&1 ;; split*) timeout 300 bun test --isolate $X > out.txt 2>&1 ;; esac; code=$?
            nf=$(grep -c '^(fail)' out.txt || true)
            echo "### ${{ matrix.sha }} $MODE rep$rep exit=$code fails=$nf $(grep -E '^ *[0-9]+ (pass|fail)$' out.txt | tr -s ' \n' ' ')"
            grep '^(fail)' out.txt | cut -c1-160 | sed 's/^/#### /'
            ps -eo pid,ppid,etimes,comm,args --sort=etimes | grep -vE 'Runner|ps -eo|grep|bash|systemd|kworker|sshd|containerd|dockerd|agetty|\[' | head -30 | sed 's/^/@@@@ /'
            ls /tmp | head -40 | sed 's/^/%%%% /'
          done
