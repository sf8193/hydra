# hydra.toml: whom hydra serves. Lives at <state dir>/hydra.toml (e.g. ~/.claude/channels/discord/hydra.toml).
# hydra re-reads it within a second of a change; a file that fails to load keeps the last good config and tells the
# operator why. An empty file is valid: the operator's DMs go to main and nothing else is heard.
# Start from your old files with `hydra migrate` rather than writing it by hand (see README › Configuration).
# Another repo's specialist and schedules: ship them as a fragment of [specialists.*] and [schedules.*] tables, and
# add it with `hydra config add <fragment.toml>` (README › Configuration).
# Every key below is optional unless it says required. Unknown keys are errors, so a typo never passes silently.
#
# Two kinds of door. A gateway is where the operator talks to hydra (Discord, Slack). A connector is where outside events arrive
# (Slack, GitHub, a clock). Slack is both: its gateway needs no table here, its connector is the [slack.apps.*] tables below.
#
# Kind prefixes. A value naming a place, address, target, person, role or app says which, or it is an error: `slack:#help`,
# `discord:<id>`, `github:owner/repo`, `cli`; `main` or `specialist:<id>`; `person:<id>`; `role:<name>`; `app:<id>`.
# These take a bare name: `operator` (a [people] id), `sends_to` and `renamed_from` (specialist ids), `mcp_servers` (server names),
# a person's `roles` (written `role:<name>` wherever used), `needs` (a precondition) and `ack` (a reaction name such as `eyes`, where a specialist's `emoji` is the character).

# The one person whose DMs reach main and who passes every admin check and every specialist's `reachable_by`.
# Required once anything else is declared. A bare [people] id, not an address or a name.
operator = "op"

# --- main: how the operator's harness runs. Read each time main starts (`hydra up`, a watchdog revival), so an edit applies at its next start (not `hydra restart`, which restarts only the daemon). ---

[main]
model = "claude-opus-5-5[1m]"         # the model main starts with: a Claude alias (opus, sonnet, ...) or a full ID; main runs on Claude, so a Codex or omp alias is a load error (default: HYDRA_MODEL in .env, else hydra's default)

# --- threads: what may be done to a thread. Read at each use, so an edit applies at once. ---

[threads]
allow_destroy = false                 # true: `hydra kill <name or thread id> --destroy` (and main's kill_session with thread_id and destroy) may also delete a thread whose session record is gone (a killed session, or none ever lived there), permanently, and its starting message where hydra posted it; never a channel, a DM or a specialist's home thread (default false: it refuses and names this key; destroying a live session's thread works either way)

# --- gateways: how you talk to hydra. Discord is a gateway only if it has a table here. Tokens stay in .env. ---
# (Slack's gateway reads SLACK_BOT_TOKEN and SLACK_APP_TOKEN from .env and has no table.)

[gateways.discord]
bot_token_env = "DISCORD_BOT_TOKEN"   # required: the .env variable holding the bot token

# --- connectors: where events come from. A source with no table isn't heard. Tokens stay in .env. ---

[connectors.github]
repos = ["acme/widget"]               # required: the repos whose PR comments hydra hears, as owner/repo
poll = "3m"                           # how often it looks (default 3m)

# --- slack: one table per Slack app, [slack.apps.<id>]. Tokens stay in .env. `hydra slack manifest [<app>]` prints an app's manifest. ---
# Every app declared connects, each with its own tokens; an app whose tokens are not set is skipped, and the daemon says which key. A message leaves through the app that heard it.
# Each app is health-checked and alerted on its own (`hydra health` has a line per app): its scopes are checked against what it does, and its alerts go to the specialists it can reach (pinned to it, or unpinned where none is pinned to it), else main.
# Each token needs its own variable, one the daemon alone needs (not PATH, HOME, HYDRA_*, ...).

[slack.apps.default]
bot_token_env = "CONNECTOR_SLACK_BOT_TOKEN"   # required
socket_token_env = "CONNECTOR_SLACK_APP_TOKEN"   # the Socket Mode token (xapp-): required for Slack to connect, not for `hydra slack manifest`
display_name = "Acme helper"          # the Slack app's name: `hydra slack manifest` creates it with this name, and every alert and `hydra health` line names the app by it (default "hydra" for `default`, else the id; at most 35 characters)
description = "Answers Acme's Slack threads it is tagged in."  # what the app says it does there (at most 140)
operator_token_env = "CONNECTOR_SLACK_USER_TOKEN"   # optional: hear the channels, DMs and group DMs the operator is in, as the operator; never posts (a DM or group DM is delivered only where a place names it).
                                      # What it hears arrives through this app: see the `slack:person-dm:alice` rule

[slack.apps.sales]                    # another app: its own tokens, named by its id when it sets no display_name
bot_token_env = "SALES_SLACK_BOT_TOKEN"
socket_token_env = "SALES_SLACK_APP_TOKEN"

# --- people: whom hydra recognizes. Anyone not here is a stranger. ---

[people.op]
addresses = ["discord:100000000000000001", "slack:U0OP", "github:op"]  # required: one address per platform; one address, one person
name = "Op"                           # shown to specialists (default: the sender's Slack display name, else the id)

[people.alice]
addresses = ["slack:U0ALICE"]
roles = ["staff"]                     # bare role names; `reachable_by` and a rule's `person` write them `role:staff`. Built in: `role:people` (everyone here), `role:anyone`

[people.bob]
addresses = ["slack:U0BOB", "github:bob"]
roles = ["staff", "finance"]

# --- defaults: any specialist key, with {id} filled in, for every specialist that doesn't set it ---

[defaults.specialist]
kickoff = "/orient {id}"              # what a fresh session is told first (a revive resumes instead)
idle = "8h"                          # a session quiet this long is ended and resumes on the next message

# --- specialists: standing agents. hydra keeps each one alive; what it knows lives in its workdir, never here. ---

# One shared session that the operator reaches from the CLI and a schedule.
[specialists.ops]
workdir = "~/agents/ops"              # required: the folder it runs in (must exist). Its CLAUDE.md, skills and files live there
home_place = "discord:200000000000000001"   # a Place (not a folder; that is `workdir`): where it posts when nobody wrote to it first, in a new thread; replies with no conversation go there too (default: the operator's channel)
model = "claude-opus-5-5"
emoji = "🛠️"                          # shown in its threads' names in place of the default session emoji: one emoji character (not a :name:). Dead and paused still show their own mark. Default: the session's own emoji
renamed_from = ["operations"]         # old ids (bare), so a rename keeps its thread, session and messages accepted but not yet delivered
handoff_at = 60                       # context percent (1-99) at which an idle session is asked to hand off, whatever AUTO_HANDOFF_FULL says; read on each health poll. Not on a restricted or can_only_write_to specialist

# One session per conversation: staff questions in a channel, each thread on its own.
[specialists.crm]
workdir = "~/agents/crm"
kickoff_file = "kickoff.md"           # instead of kickoff; relative to workdir, read at each fresh start
reachable_by = ["role:staff"]          # roles (never people), each `role:<name>`, that may reach it (default ["role:people"]; [] = only the operator)
sessions = "per-conversation"         # "shared" (default): one session for everything; "per-conversation": one per thread
max_sessions = 5                      # per-conversation cap (default 20); a conversation past it waits, its messages accepted but undelivered, for at most 3 days, then they are dropped and alerted
idle = "2h"                           # end a quiet session and resume it on the next message (without it, per-conversation slots never free)

# Pinned to the app `sales`: it answers only messages through that app, and that app delivers only to specialists pinned to it.
# It shares #help with crm (which answers every app nobody is pinned to, here `default`) because no app reaches both: see the rules below.
[specialists.deals]
workdir = "~/agents/ops"
pinned_to = ["app:sales"]             # Slack apps (declared above), each `app:<id>`: only these apps deliver to it, and it takes nothing from other apps. Absent: unpinned. Only Slack places: a pinned specialist can't be sent a discord: or github: place
speaks_as = "app:sales"               # the Slack app whose bot posts for it when it answers no message (its home_place, a new thread); one of `pinned_to` if pinned.
                                      # Absent: its first pinned app; if unpinned, `default`, else the only app declared. With several apps and no `default`, required for a specialist with a Slack home_place. A `#name` home_place is resolved through that app's workspace.
                                      # `speaks_as` is which app speaks (who); `home_place` is where it posts (a place).

# A specialist other people talk to, restricted: it knows only its workdir, uses only the tools and servers it lists, and answers only its own
# conversation. `restricted = false` (the default) is the operator's account, with every tool and server they have. A workdir must be a folder
# of its own (not $HOME, not a git work tree, no symlinks out). `restricted`, `can_only_write_to`, `deny_commands`, `tools`, `mcp_servers` and `sends_to` are refused in [defaults.specialist] and in `hydra
# config add` fragments. Each new start is checked against this, from Claude Code's own debug file (docs/slack.md, "A specialist other people talk to",
# which shows the same kind of specialist as a file of its own, named `ops`). Its `.env` variables are read when the daemon starts.
[specialists.helpdesk]
workdir = "~/agents/helpdesk"
pinned_to = ["app:sales"]             # pinned, because the `sales` app is pinned by deals: an unpinned specialist would lose it (hydra.toml warns)
reachable_by = ["role:staff"]
restricted = true
tools = ["Read", "Grep", "Glob"]      # built-in tools; these three are the default and all it may list
mcp_servers = ["datadog"]             # names from [mcp_servers.*] below
sends_to = ["triage"]                  # bare specialist ids: the specialists it may send to with send_to_thread (shared-session specialists, never main); refused unless restricted = true

# What helpdesk hands a question to: restricted too, with a folder of its own. No rule sends a place to it; only helpdesk's sends_to reaches it.
[specialists.triage]
workdir = "~/agents/triage"
reachable_by = []
restricted = true
sends_to = ["helpdesk"]                # the way back: its answer is a send_to_thread(type = "result") to helpdesk

# One trusted person's assistant: the operator's account, tools and servers (a shell, edits, a browser), with Bash and Edit/Write writes confined to its
# workdir, by Claude Code's own sandboxed Bash and write block (needs Claude Code 2.1.314 or newer), and Claude Code's tools and shell are denied reading the
# operator's credential places (~/.ssh, ~/.aws, ~/.config/gh, the keychain, browser profiles, hydra's state folder, other specialists' workdirs); the network is meant to stay open (not proven live).
# It confines damage, and denies those reads to Claude Code only: its MCP servers and browser run outside the sandbox and still read them; the network is open.
# Credential separation (`run_as`) is planned, not built. `hydra config check` warns when someone can reach it. Not combinable with `restricted = true`.
[specialists.assistant]
workdir = "~/agents/assistant"
reachable_by = []                      # only the operator here; a role added to it makes `hydra config check` warn that it can reach the operator's account
pinned_to = ["app:sales"]             # (pinned, for the same reason as helpdesk)
can_only_write_to = "workdir"                  # the place its writes are confined to (a string or a list); today the one value is "workdir". This turns the whole layer on
cannot_read = ["~/notes"]              # optional, only with can_only_write_to: paths ADDED to the built-in credential places Claude Code's tools and shell may not read
deny_commands = ["rm -rf *"]           # optional: Bash patterns it may not run, on top of the confinement (each becomes a Bash(...) deny rule)
tools = ["Bash", "Edit", "Write", "Read", "Grep", "Glob"]   # optional: its built-in tools (--tools); absent: all. Its MCP servers are only those in mcp_servers, and claude.ai connectors are always off
browser_profile = "chrome-profile"      # optional: the folder (inside the workdir, relative or absolute; one per specialist) its listed servers get as {profile_dir}; downloads beside it as chrome-profile-downloads. Names the folder, does not confine the browser. Absent: <workdir>/.browser/profile
mcp_servers = ["browser"]              # servers started for it with its OWN browser profile and download folders, by default <workdir>/.browser/{profile,downloads}

# PR reviews on one repo.
[specialists.reviewer]
workdir = "~/code/widget"
engine = "claude"                     # which agent program runs its fresh sessions: claude | codex (a Codex model alias in `model` picks it too; naming both so they disagree is an error). An existing conversation keeps the engine it already ran on. omp is refused: it cannot restrict a session's tools. restricted = true needs claude
env_file = ".env.reviewer"            # extra environment for its sessions; relative to workdir

# --- restricted: folders no restricted specialist's workdir may be, hold or sit inside, beyond the built-in ones. This table is not a specialist's `restricted = true` (the switch) ---

[restricted]
off_limits = ["~/notes"]               # absolute paths, or starting with ~
# allow_unproven_macos = true          # a restricted specialist that lists servers runs under a sandbox proven only on some macOS versions
#                                      # (docs/slack.md names them); on any other it is refused at launch unless you set this. Default: off

# --- mcp_servers: declared here, at the top, as [mcp_servers.<name>]; a restricted specialist lists their names in its own `mcp_servers = [...]`. Per-operator: only hydra.toml declares one ---

[mcp_servers.datadog]
command = "/usr/local/bin/datadog-mcp"   # required: a pinned binary or versioned package, not `npx -y` latest
token_env = ["DD_API_KEY"]               # names in the state dir's .env; only these reach the server, and hydra removes them from every session's environment (never GH_TOKEN or the SSH agent: a variable sessions need cannot be removed from them)
tools = ["search_logs", "get_monitor"]   # the tools of it a specialist may call (default: none, which a specialist cannot list)
# Listing a server means running code you trust with your own privileges. Its `tools` limits which of its tools the specialist may call.
# On macOS it also runs under a best-effort sandbox (hygiene, not containment; the network stays open): no unix sockets but name lookup,
# file writes only in its own temp folder and two devices, /dev/null and /dev/dtracehelper (emptied at each start: a server that must keep data cannot run here), no credential folders,
# no other process's environment or command line.

# A browser server for a `can_only_write_to` specialist: how it takes its own profile and download folders, which hydra fills in at each start.
# `profile_args` are the arguments added to the command (`profile_env` would be set for it). {profile_dir} and {download_dir} are the only placeholders.
# Nothing else in hydra knows what the server is: this declaration is the whole contract. The browser it drives still runs outside Claude Code's sandbox.
# This one is Microsoft's Playwright MCP server (`@playwright/mcp`, pinned) driving the installed Google Chrome. Playwright has no downloads flag:
# `--output-dir` is where downloads go, and also its auto-named snapshots (one per navigation), screenshots and traces. The server's name is yours to pick (`browser` here; `playwright` is fine too):
# hydra's allowlist admits it by its exact command, so an operator server of the same name with another command does not start.
# A session's browser is headless (`--headless`): no window reaches the operator's screen. `--browser chrome` drives the Google Chrome installed on the machine and needs nothing else installed.
# The first start downloads the package into ~/.npm/_npx, and Claude Code waits 30 seconds for a server: run `npx -y @playwright/mcp@0.0.85 --version` once first.
[mcp_servers.browser]
command = "npx"
profile_args = ["-y", "@playwright/mcp@0.0.85", "--browser", "chrome", "--headless", "--user-data-dir", "{profile_dir}", "--output-dir", "{download_dir}"]
# `hydra specialist browser <name>` opens that specialist's browser on its profile folder, headed, once, to log it in: login_command is the command (its first element
# an executable; the same placeholders). Playwright starts Chrome with --password-store=basic --use-mock-keychain, so a login made in a Chrome without them is
# encrypted with the operator's own keychain key, which the specialist's Chrome cannot read: the login command carries both. A Chrome keeps SingletonLock in its
# profile folder while it runs: profile_locks names it, and the command refuses while it is there. Per-operator: hydra names no browser.
login_command = ["/Applications/Google Chrome.app/Contents/MacOS/Google Chrome", "--user-data-dir={profile_dir}", "--password-store=basic", "--use-mock-keychain", "--no-first-run"]
profile_locks = ["SingletonLock"]
# `deny_tools` are tools of this server a write-confined session may not call, each written as a deny rule `mcp__<server>__<tool>` in its launch settings, so
# Claude Code does not offer them. Playwright's `browser_run_code_unsafe` runs arbitrary Playwright code in the server, outside Claude Code's sandbox, and with it a
# session reads any local file through the browser (`page.goto("file:///...")`), which the server's own file: block on `browser_navigate` does not stop.
# Names are matched exactly (case included) and a name that matches nothing is accepted: recheck deny_tools whenever you bump the pinned server version, since a renamed tool reopens it.
deny_tools = ["browser_run_code_unsafe"]
# To never start your real Chrome, use Playwright's own Chromium (Chrome for Testing, the build the pinned server wants: `--browser chromium`): change `--browser chrome` to `--browser chromium`
# in profile_args, and open the login window with Playwright too (its launcher adds --password-store=basic --use-mock-keychain to every Chromium launch itself; the version is the one
# @playwright/mcp@0.0.85 depends on): login_command = ["npx", "-y", "playwright@1.66.0-alpha-2026-11-09", "open", "--browser", "chromium", "--user-data-dir={profile_dir}"]
# A fresh machine lacks that build, and the first browser tool call fails until it is installed (a few hundred MB, once): setup_command is the command `hydra specialist browser` runs first for it,
# setup_command = ["npx", "-y", "@playwright/mcp@0.0.85", "install-browser", "chrome-for-testing"]
# (the server under a write-confined launch was shown with chromium; that headed login window was not run).


# --- places: optional platform options for one place ---

[places."slack:#help"]
messages = "all"                      # "addressed" (default): only a DM or a tag opens a conversation; "all": any top-level message
ack = "eyes"                          # the reaction (by name, not "👀" or ":eyes:"; a skin tone is "+1::skin-tone-3") added once a message is delivered
files = true                          # download attachments (default false)
bots = false                          # hear other bots (default false; hydra's own bot is never heard)
reactions = "bot-messages"            # a Slack place: a person's emoji reaction is delivered to the session that owns the conversation it is in. "bot-messages": only on a message the bot posted; "all": on any message of a conversation hydra holds; "off" (default). Who may be heard is the place's rules, as for a message
default_app = "app:default"           # a Slack channel only: when two apps are in it, the app that answers a message that tags neither (a tag always picks the app); not the app named `default`
                                      # (here they happen to match). Absent: the app named `default`, else the first app above, among those that deliver to someone here. An untagged follow-up stays with the app that opened the conversation.
link_previews = true                  # false: no link previews (Slack unfurl_links/unfurl_media, Discord suppress-embeds) on what hydra posts here: replies, new threads, DMs, alerts; not Slack edits (default true)

# The channel helpdesk answers: it hears every top-level post, and its answers carry no previews.
[places."slack:#ops"]
messages = "all"
link_previews = false

# --- schedules: clocks that send a message to a specialist. A schedule's message carries the operator's authority. ---
# (A repo adding its own: `hydra config add <fragment.toml>`.)

[schedules.nightly-review]
cron = "0 3 * * *"                    # required: 5 fields, local time (or its `timezone`)
target = "specialist:ops"            # "main", or "specialist:<name>" for a declared specialist (required unless it's a sensor, below)
message = "Nightly run: look over yesterday's work."

# A check first: empty output sends nothing; anything it prints is appended to the message.
[schedules.disk-watch]
cron = "*/30 * * * *"
target = "specialist:ops"
message = "The disk check found something:"
check = "./scripts/disk-check.sh"
workdir = "~/agents/ops"              # the check's working dir (absolute or ~/); a relative env_file is under it

# A sensor: no `target`, so it sends nothing and takes no message; only its check runs, and a failure alerts the operator.
[schedules.backup-watch]
cron = "0 * * * *"
check = "~/bin/backup-fresh.sh"
runner = "daemon"                     # what runs the check: "launchd" (default) tries once; "daemon" keeps trying while hydra runs
needs = ["internet"]                  # a bare precondition name (only `internet` is known); daemon runner only: deferred while offline
alert_after = "2d"                    # daemon runner only: how long a failure run lasts before it is alerted (default 1d)

# Paused: still loaded and validated, shown as `paused` in `hydra schedules list`, and never fired (either runner). Remove the key to resume.
[schedules.weekly-digest]
cron = "0 9 * * MON"
target = "main"
message = "Weekly digest."
paused = true
# A schedule for another region: `timezone` makes `cron` that zone's wall-clock time, so it stays put when either side's clocks change.
[schedules.morning-brief]
cron = "0 9 * * 1-5"                  # 09:00 on weekdays in Dubai, whatever zone this Mac is in
target = "main"
message = "Morning brief."
runner = "daemon"                     # required with `timezone`: a launchd entry fires in the host's zone
timezone = "Asia/Dubai"               # an IANA zone name

# --- rules: who hears what. Each names a place, an app, or both, and the target that answers; first match in file order wins. This is the one home of where a specialist is heard. ---
# An absent `place` matches every place and an absent `app` every app. `person` only narrows: a rule needs place or app.
# A place is slack:#name, slack:C0ID, slack:person-dm:<person>, slack:app-dm:<app>, slack:group-dm:<G id>, discord:#name, discord:<id>, discord:app-dm:*, github:owner/repo or cli.
# person-dm, app-dm and group-dm also take * for every one of that kind: slack:app-dm:* is every Slack app's DMs, slack:group-dm:* every group DM. An entry for one (slack:app-dm:sales) wins over the * entry in [places].
# Discord has one bot, so its only DM place is discord:app-dm:*. The app of a single-app setup is the one named `default`: slack:app-dm:default.
# Two rules that take every message at one place through one app (no `person`) are an error: the later could never match. A rule with a `person` goes before the rule for everyone.

# Finance in #help goes to ops. A rule whose target the app that heard the message cannot deliver to is skipped, not a dead end:
# through `sales` (it delivers only to specialists pinned to it) this rule is skipped and the next one that fits decides.
[[rules]]
place = "slack:#help"
person = "role:finance"               # `person:<id>` or `role:<name>` (absent: anyone there)
target = "specialist:ops"            # "main", or "specialist:<name>"

[[rules]]
place = "slack:person-dm:alice"       # needs an app with operator_token_env: the operator's DM with the person alice (a [people] id with a Slack address); slack:app-dm:<app> is a DM with that app's bot, slack:group-dm:* every group DM
app = "app:default"                # only through this app, the one holding operator_token_env, so that is the app that hears this DM
target = "specialist:ops"

[[rules]]
place = "slack:#help"
app = "app:sales"                     # an app alone matches every message that comes through it (which would include a restricted specialist's home_place: hydra.toml refuses that); with `place`, that place through that app only
person = "role:finance"
target = "specialist:deals"          # must be a specialist the app can reach: pinned to sales, or any specialist while no one pins sales

# Everyone's messages at a place, to the specialist that answers there. Two rules for one place with no `person` or `app` are
# not duplicates here: each specialist is served by a different app (crm by `default`, deals only by `sales`), so a message matches one.
[[rules]]
place = "slack:#help"
target = "specialist:crm"             # unpinned: it answers through the apps nobody is pinned to, here `default`

[[rules]]
place = "slack:#help"
target = "specialist:deals"           # pinned to sales: it answers through that app only, so it shares #help with crm

[[rules]]
place = "slack:#ops"
target = "specialist:helpdesk"

[[rules]]
place = "slack:#assistant"
target = "specialist:assistant"

[[rules]]
place = "github:acme/widget"
target = "specialist:reviewer"

# --- guard: the operator's hook, run after routing and the `reachable_by` check for anyone but the operator ---

[guard]
command = "~/bin/hydra-guard"         # required: stdin {person, roles, place, conversation, target}; exit 0 delivers (print {"target": "specialist:x"} to redirect), 10 drops, 75 deferred
timeout = "5s"                        # past this, the message is delivered and the timeout logged (at most 30s)
include_text = false
owed_max = "1h"                       # how long deferred may keep a message accepted but undelivered before it fails visibly

# --- vitals: when the once-a-minute vitals tick tells the operator the host is in trouble (every key optional) ---

[vitals]
overload_load_per_core = 1.5          # overload: 15-minute load at least this × cores (a ratio, no upper limit)...
overload_idle_pct = 15                # ...while CPU idle is under this % (macOS load counts waiting threads, not busy cores)
swap_used_pct = 85                    # memory off macOS (Linux): swap used at least this % of swap total, for `ticks` in a row.
                                      # Not used on macOS: its swap total grows by whole swap files on demand, so used/total moves with
                                      # allocation, not pressure. There the OS's pressure level is judged: warn or critical for `ticks` in a
                                      # row alerts; critical alerts at once, even after a warn alert. The alert lists the largest processes
ticks = 3                             # vitals ticks in a row a condition must hold; one alert per episode (an undelivered one is retried, at most every 15m)
resume_settle = "20m"                 # overload is not judged this long after the machine wakes from sleep; a loop stall doesn't count
                                      # as a wake where the OS can tell them apart (macOS), elsewhere a stall of 60s or more does
memory_cooldown = "24h"               # at most one memory alert this often while the daemon runs (a restart starts afresh); on macOS
                                      # the warn and critical alerts each have their own
