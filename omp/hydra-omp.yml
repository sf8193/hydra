# Passed to every hydra omp session with `omp --config`. The claude provider stays on so omp sees ~/.claude and a repo's
# .claude/ skills and commands. These two stay off: claude-plugins and mcp-json would start a second Discord MCP server
# (the plugin, and the repo's .mcp.json) next to the extension's bridge.
disabledProviders: [claude-plugins, mcp-json]
