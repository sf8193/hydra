# A full config in the key names before the rename: allow, mcp, talks_to and [defaults] private_roots (the guard's `to` is a guard, not a key here).
operator = "op"
[slack.apps.default]
bot_token_env = "CONNECTOR_SLACK_BOT_TOKEN"
[people.op]
addresses = ["slack:U0OP"]
[people.alice]
addresses = ["slack:U0ALICE"]
roles = ["staff"]
[defaults]
private_roots = ["/home/op/notes", "~/Workstreams"]
[defaults.specialist]
allow = ["staff"]
[mcp.datadog]
command = "/usr/local/bin/datadog-mcp"
token_env = ["DD_API_KEY"]
tools = ["search_logs"]
[specialists.helpdesk]
workdir = "/home/op/agents/helpdesk"
restricted = true
mcp = ["datadog"]
talks_to = ["triage"]
[specialists.triage]
workdir = "/home/op/agents/triage"
allow = []
restricted = true
talks_to = ["helpdesk"]
[specialists.plain]
workdir = "/home/op/agents/plain"
allow = ["staff", "anyone"]
[[rules]]
place = "slack:#help"
target = "specialist:helpdesk"
[[rules]]
place = "slack:#plain"
target = "specialist:plain"
