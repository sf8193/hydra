# A full config with every target written bare: a rule's, a schedule's, `main` and specialist names. Loaded before and after targets said their kind.
operator = "op"
[connectors.slack]
bot_token_env = "CONNECTOR_SLACK_BOT_TOKEN"
[slack.apps.sales]
bot_token_env = "SALES_SLACK_BOT_TOKEN"
[people.op]
addresses = ["slack:U0OP"]
[specialists.ops]
workdir = "/home/op/ops"
listens = ["slack:dm"]
[specialists.deals]
workdir = "/home/op/deals"
pinned_to = ["sales"]
speaks_as = "sales"
listens = ["slack:#deals"]
[specialists.crm]
workdir = "/home/op/crm"
sessions = "per-conversation"
kickoff = "Hello."
[schedules.nightly]
cron = "0 3 * * *"
target = "ops"
message = "Nightly."
[schedules.to-main]
cron = "0 9 * * 1"
target = "main"
message = "Weekly."
[schedules.sensor]
cron = "*/5 * * * *"
check = "true"
[[rules]]
place = "slack:#sales-help"
target = "crm"
[[rules]]
app = "sales"
target = "deals"
[[rules]]
place = "slack:#oncall"
person = "op"
target = "main"
