# A full config in the key names before the rename: rule at/from/to, schedule to, place listen. Loaded on the commit before and after.
operator = "op"
[connectors.slack]
bot_token_env = "CONNECTOR_SLACK_BOT_TOKEN"
app_token_env = "CONNECTOR_SLACK_APP_TOKEN"
[slack.apps.sales]
bot_token_env = "SALES_SLACK_BOT_TOKEN"
[people.op]
ids = ["slack:U0OP"]
[people.alice]
ids = ["slack:U0ALICE"]
roles = ["staff"]
[specialists.crm]
workdir = "/home/op/agents/crm"
listens = ["slack:#help"]
allow = ["staff"]
[specialists.ops]
workdir = "/home/op/agents/ops"
listens = ["slack:dm"]
[specialists.deals]
workdir = "/home/op/agents/deals"
apps = ["sales"]
[places."slack:#help"]
listen = "all"
ack = "eyes"
[places."slack:#ops"]
listen = "mentions"
[places."slack:#quiet"]
files = true
[schedules.nightly]
cron = "0 3 * * *"
to = "ops"
prompt = "Nightly run."
[schedules.sensor]
cron = "@hourly"
check = "true"
[[rules]]
at = "slack:#help"
from = "alice"
to = "ops"
[[rules]]
at = "slack:#ops"
app = "sales"
to = "deals"
[[rules]]
at = "slack:#ops"
from = "staff"
to = "main"
[[rules]]
app = "default"
from = "people"
to = "crm"
