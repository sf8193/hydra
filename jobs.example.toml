# The old format. New setups declare [schedules.<id>] in <state dir>/hydra.toml (README, "Schedules"); an existing
# jobs.toml runs exactly as before until `hydra migrate` moves its jobs there.
#
# Copy to <state dir>/jobs.toml, then `hydra jobs sync <platform>`. Each job runs at its local-time slots; a slot
# missed while the machine slept runs once on wake. `hydra jobs list <platform>` validates the file and shows each
# job's state.
#
# runner: launchd tries once, no matter what. daemon keeps trying, as long as hydra runs (and adds needs and
# alert_after below). Delivery is always the daemon's. Set it here for the whole file, or on a job to override it;
# absent everywhere, it's launchd.
#
# A job's check script prints nothing when all is well. Anything it prints is passed to the agent.
# Exit 75 means "not now": not an attempt, no message. A daemon-runner job tries again on the next tick; under launchd,
# which has no retries, that slot is skipped.
# Any other nonzero exit is a failure. A daemon-runner job's slot is owed until it is done: a failed attempt is retried
# with back-off (min(2^n minutes, 1h, the schedule's period)), and a failure run is alerted once, after alert_after.
# Under launchd, a failure is alerted at once.
#
# A daemon-runner job can add:
# alert_after = "2d"      how long a failure run lasts before it is alerted, 1m to 30d (default 1d)
# needs = ["internet"]    not now while offline (the captive-portal probe and the daemon's gateway both down)
# `hydra jobs mark-done <platform> <name>` marks the latest slot done without running it (runner = "daemon" only).
#
# cwd = "~/build"         the check's working dir (absolute, or ~/), so check = "./scripts/x.sh" works
# env_file = "~/build/.env"  KEY=VALUE lines added to the check's environment, read at each run; not expanded.
#                         A failing check's output is shown with these values (4+ characters) blanked out.
#                         The check reads both with the daemon's macOS access: a path under ~/Documents, ~/Desktop
#                         or ~/Downloads works only if the daemon's tmux server has access there
#                         (docs/macos-permissions.md). `jobs list` warns about such paths.
#
# Each job has one target: where its message (prompt, then the check's output) goes.
# to = "ops"          a specialist (hydra specialist list), "main", or a thread id. A specialist with no live
#                     session gets one, started from its kickoff. `jobs list` flags a name that isn't declared.
# revive = true       (to a thread id) restart the thread's session if it is gone; a specialist heals anyway.
# spawn = { channel = "…", kickoff = "…", model = "haiku", idle = "4d" }
#                     a fresh session every time, closed when it finishes. channel falls back to the job's, then
#                     the top-level one. kickoff (or kickoff_file, read at each run) comes before the prompt.
#                     model: default is the daemon's. idle: how long the session may go with no one posting in its
#                     thread before it is nudged, then ended 5m later (default 30m, max 7d).
# mode = "none"       no agent: the check runs and the result is recorded.
# A prompt is optional when there is a check (or a spawn kickoff): the check's output is then the whole message.
# Older files keep working: mode = "main" is to = "main"; mode = "spawn" (with model, idle_ttl) is spawn = { … }.

runner = "launchd"

# Default for spawn jobs. Use a server channel: Discord cannot open a thread inside a DM, and a DM id
# makes every spawn fail with "no channel to spawn in".
channel = "000000000000000000"

# Worked example: a morning "where did we leave off" digest. No check script, so it fires every day.
# The prompt tells main to hand the reading to a cheap subagent and post only the bullets.
[thread-digest]
schedule = "30 7 * * *"
to = "main"
prompt = """Daily thread digest for Sam. Start a Haiku subagent (Agent tool, model haiku) to do the work, then post its result to Sam.

Subagent steps:
1. List live sessions (list_sessions). Keep this output out of the message.
2. For each thread, fetch its messages from the last 24 hours. Skip threads with no activity.
3. Find the thread's emoji: it starts the thread's title line, like "🪐 topic · name".
4. Write each thread as a link bullet, then two sub-bullets: `- 🪐 [name](thread link)` / `  - Blockers: what it waits on Sam for, or none` / `  - Next: the single next step`. Max 15 words per sub-bullet.
5. If nothing is open, write `done, safe to kill` as the only sub-bullet.
6. Put threads with blockers first.

Post only the bullets under a one-line heading. No session list, no tables, no "nothing to report" message if there were no active threads."""

[dependency-scan]
schedule = "0 6 * * *"            # 5-field cron, local time
check = "~/scripts/dependency_scan.sh"
spawn = { model = "haiku", idle = "4h" }
prompt = "Triage the scan output below. Report only new, reachable findings."

[security-digest]
schedule = "0 9 * * MON"
to = "main"
prompt = "Summarize this week's security scan results for the user."

[nightly-build]
schedule = "0 2 * * *"
check = "./scripts/nightly-check.sh"
cwd = "~/build"
env_file = "~/build/.env"
to = "ops"                        # a specialist: the same thread, and the history, every night

[log-cleanup]
schedule = "0 1 * * *"
check = "~/scripts/cleanup_logs.sh"
mode = "none"

# A weekly obligation: no script at all. Runs once per Friday slot, retried while offline or failing.
[weekly-review]
runner = "daemon"
schedule = "0 11 * * FRI"
spawn = {}
prompt = "Run the weekly review."
needs = ["internet"]
