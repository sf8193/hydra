# Copy to <state dir>/jobs.toml. The daemon reads it every minute and runs each job at its local-time slots;
# a slot missed while the machine slept runs once on wake. `hydra jobs list <platform>` validates the file and shows
# each job's state.
#
# A job's check script prints nothing when all is well. Anything it prints is passed to the agent.
# Exit 75 means "not now": not an attempt, no slot used, no message; it is tried again on the next tick.
# Any other nonzero exit is a failure: the daemon posts one "job failed" message per local day while it keeps failing.
#
# A plain job gets one attempt per slot, whatever the result. Add:
# durable = true          a failed attempt doesn't use up the slot: it is retried, with backoff
#                         (min(2^n minutes, 1h, the schedule's period)), until it succeeds. Failures alert once per
#                         failure run, after alert_after, instead of daily.
# alert_after = "2d"      (durable only) how long a failure run lasts before it is alerted, 1m to 30d (default 1d)
# needs = ["internet"]    not now while offline (the captive-portal probe and the daemon's gateway both down)
# overlap = "absorb"      (spawn only) a still-open session from this job handles the owed slot instead of a new
#                         spawn; one stuck on a prompt, or still open from the slot before, is a failure
# `hydra jobs mark-done <platform> <name>` marks the latest slot done without running it.
#
# mode = "spawn"  a fresh agent session in `channel`, closed when it finishes
# mode = "main"   the prompt goes to the main session
# mode = "none"   no agent: the check runs and the result is recorded
#
# model = "haiku"  (spawn only) model id or alias for the spawned session; default is the daemon's default.
# idle_ttl = "4d"  (spawn only) how long the session may go with no one posting in its thread before it is
#                  nudged, then ended 5m later (default 30m, max 7d). Raise it when the session waits on a reply.

# Default for spawn jobs. Use a server channel: Discord cannot open a thread inside a DM, and a DM id
# makes every spawn fail with "no channel to spawn in".
channel = "000000000000000000"

# Worked example: a morning "where did we leave off" digest. No check script, so it fires every day.
# The prompt tells main to hand the reading to a cheap subagent and post only the bullets.
[thread-digest]
schedule = "30 7 * * *"
mode = "main"
prompt = """Daily thread digest for Sam. Start a Haiku subagent (Agent tool, model haiku) to do the work, then post its result to Sam.

Subagent steps:
1. List live sessions (list_sessions). Keep this output out of the message.
2. For each thread, fetch its messages from the last 24 hours. Skip threads with no activity.
3. Find the thread's emoji: it starts the thread's title line, like "🪐 topic · name".
4. Write each thread as a link bullet, then two sub-bullets: `- 🪐 [name](thread link)` / `  - Blockers: what it waits on Sam for, or none` / `  - Next: the single next step`. Max 15 words per sub-bullet.
5. If nothing is open, write `done, safe to kill` as the only sub-bullet.
6. Put threads with blockers first.

Post only the bullets under a one-line heading. No session list, no tables, no "nothing to report" message if there were no active threads."""

[dependency-scan]
schedule = "0 6 * * *"            # 5-field cron, local time
check = "~/scripts/dependency_scan.sh"
mode = "spawn"
prompt = "Triage the scan output below. Report only new, reachable findings."

[security-digest]
schedule = "0 9 * * MON"
mode = "main"
prompt = "Summarize this week's security scan results for the user."

[log-cleanup]
schedule = "0 1 * * *"
check = "~/scripts/cleanup_logs.sh"
mode = "none"

# A weekly obligation: no script at all. Runs once per Friday slot, retried while offline or failing, and handled
# by the previous review's session if that one is still open.
[weekly-review]
schedule = "0 11 * * FRI"
mode = "spawn"
prompt = "Run the weekly review."
durable = true
needs = ["internet"]
overlap = "absorb"
